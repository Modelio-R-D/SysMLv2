<h1 id="greffer-sysml-v2kerml-sur-linfrastructure-modelio">Greffer SysML v2/KerML sur l'infrastructure Modelio</h1>
<h2 id="plan-dimpl%C3%A9mentation-pour-le-package-implementation">Plan d'implémentation pour le package <code>implementation</code></h2>
<p>Juan Cadavid · 2026-08-21</p>
</section>

<h1 id="de-quoi-parle-ce-plan">De quoi parle ce plan</h1>
<div class="box m">
Comment brancher le métamodèle KerML/SysML v2 sur l'infrastructure native de Modelio (<code>EObject</code>, <code>MObject</code>, <code>Note</code>, <code>Dependency</code>…) pour que SemGen puisse en générer un métamodèle Java valide — sans dupliquer ce que Modelio offre déjà, et sans casser la fidélité du package <code>reference</code>.
</div>
<p><strong>Partie 1 · SysML v2 pour un œil UML</strong> — le vocabulaire qui change (<code>def</code>/usage, <code>Feature</code>, <code>item</code>/<code>part</code>/<code>attribute</code>, specialization/subsetting/redefinition, occurrence/succession/flow, <code>Requirement</code>), avec exemples réels</p>
<p><strong>Partie 2 · Le point de greffe sur l'infrastructure Modelio</strong> — la chaîne KerML générée passe par <code>EObject</code>/<code>MObject</code> et <code>SmObjectImpl</code> ; le précédent UML <code>ModelElement</code> est distingué ; ce que ça change pour le nommage KerML</p>
<p><strong>Partie 3 · Chevauchements avec l'infrastructure Modelio</strong> — trois cas concrets (<code>Comment</code>/<code>Documentation</code>, <code>Dependency</code>, métadonnées), exemples réels tirés de la spec OMG SysML v2, avec citations</p>
<p><strong>Partie 4 · Héritage multiple de KerML en Java</strong> — le correctif SemGen conserve les parents multiples dans l'API et aplatit les membres secondaires dans l'implémentation ; validation et limites restantes</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" lang="en-US" data-marpit-pagination="3" style="--paginate:true;" data-marpit-pagination-total="65">
<h1 id="le-package-reference-est-termin%C3%A9-implementation-ne-lest-pas">Le package <code>reference</code> est terminé. <code>implementation</code> ne l'est pas.</h1>
<div class="two-col">
<div>
<p><strong><code>reference</code> — miroir fidèle de la spec</strong></p>
<ul>
<li>182 classes, 209 généralisations, 351 associations</li>
<li>Audité jusqu'à 0 écart par rapport au XMI normatif</li>
<li>Hiérarchie autonome, sans lien avec l'infrastructure Modelio</li>
<li>Reste intouché — c'est notre référence de fidélité, coquilles comprises</li>
</ul>
</div>
<div>
<p><strong><code>implementation</code> — la vraie cible</strong></p>
<ul>
<li>Même métamodèle, mais doit se brancher sur l'infrastructure Modelio</li>
<li>Objectif : alimenter le module <strong>SemGen</strong> de Modelio pour générer un<br />
métamodèle JavaDesigner valide (code Java mm.api + mm.impl)</li>
<li>Actuellement une copie de <code>reference</code> sans lien avec l'infrastructure —<br />
c'est exactement l'écart que ce plan doit combler</li>
</ul>
</div>
</div>
<div class="takeaway">Ce plan ne concerne que <strong>implementation</strong>. <strong>reference</strong> n'est pas touché.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-class="section theme-violet" lang="en-US" class="section theme-violet" data-marpit-pagination="4" style="--paginate:true;--class:section theme-violet;" data-marpit-pagination-total="65">
<h1 id="partie-1--sysml-v2-pour-un-%C5%93il-uml">Partie 1 · SysML v2 pour un œil UML</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="5" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="sysml-v2-pour-un-%C5%93il-uml--le-vocabulaire-qui-change">SysML v2 pour un œil UML : le vocabulaire qui change</h1>
<div class="two-col">
<div>
<p><strong><code>def</code> / usage — la rupture principale</strong></p>
<ul>
<li>UML sépare déjà <code>Classifier</code>/<code>InstanceSpecification</code> — pas la nouveauté. La rupture : un <code>Property</code> UML (<code>wheels</code> sur <code>Car</code>) n'est qu'une feature typée, pas un <code>Classifier</code> — elle ne peut ni hériter ni se spécialiser pour son propre compte</li>
<li>SysML v2 promeut chaque usage (<code>PartUsage</code>…) au rang de quasi-type : nom propre, sous-usages propres, peut spécialiser un autre usage — tout en restant typé par un <code>def</code></li>
</ul>
<p><strong><code>Feature</code> — généralise <code>Property</code></strong></p>
<ul>
<li>Chapeaute attribut, port, paramètre, association-end dans une seule notion unifiée (typage + multiplicité), réutilisée partout</li>
</ul>
</div>
<div>
<p><strong>Trois relations à ne pas confondre</strong></p>
<ul>
<li><strong>Specialization</strong> (<code>:</code>) : héritage classique, comme <code>Generalization</code> en UML</li>
<li><strong>Subsetting</strong> (<code>:&gt;</code>) : un feature restreint l'ensemble de valeurs d'un feature plus général — pas d'équivalent UML direct, proche d'une contrainte de sous-ensemble</li>
<li><strong>Redefinition</strong> (<code>:&gt;&gt;</code>) : un feature hérité est remplacé par un feature plus spécifique dans un contexte usage — proche de <code>redefinedProperty</code> UML, mais généralisé à tout <code>Feature</code></li>
</ul>
<p><strong>Occurrence, Succession, Flow</strong></p>
<ul>
<li><code>Occurrence</code> : quelque chose qui existe dans le temps (remplace/étend la notion d'instance UML)</li>
<li><code>Succession</code> / <code>Flow</code> : ordonnancement et échange entre occurrences — équivalent enrichi des <code>ControlFlow</code>/<code>ObjectFlow</code> UML/SysML v1</li>
</ul>
</div>
</div>
<div class="takeaway">Point clé pour la suite : chaque case des 34 cas d'héritage multiple oppose l'axe <strong>Definition/Usage</strong> à un axe UML plus classique (<code>Classifier</code>, <code>Relationship</code>, <code>Feature</code>…).</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="6" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="exemple--def--usage">Exemple · <code>def</code> / usage</h1>
<p style="font-size:0.6em;color:#888;">Source : SysML v2.0, §7.6.1 « Definition and Usage Overview »</p>
<div class="two-col">
<div>
<p><strong>Le <code>def</code>, réutilisable — comme une <code>Class</code> UML</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>part def Vehicle {
    part wheels[4..8];
    attribute mass : Real default 1500.0;
}
</code></pre>
<p><strong>Le usage, une occurrence typée</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>part vehicle : Vehicle;
</code></pre>
</div>
<div>
<p><strong>Ce qu'un <code>Classifier</code> UML ne capture pas</strong></p>
<ul>
<li><code>vehicle</code> n'est pas juste « une instance » : c'est lui-même un élément du modèle, avec son propre nom, sa propre hiérarchie de sous-usages, et il peut être spécialisé à son tour</li>
<li>Un <code>def</code> peut spécialiser un autre <code>def</code> (<code>Truck :&gt; Vehicle</code>) ; un usage peut spécialiser un autre usage — les deux hiérarchies restent parallèles et distinctes</li>
</ul>
</div>
</div>
<div class="takeaway"><code>Vehicle</code> est un <code>def</code> ; <code>vehicle</code> est un usage typé par <code>Vehicle</code> — deux éléments, deux hiérarchies d'héritage possibles.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="7" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="exemple--feature">Exemple · <code>Feature</code></h1>
<p style="font-size:0.6em;color:#888;">Source : SysML v2.0, §7.6.1 « Definition and Usage Overview » (exemple <code>Vehicle</code>/<code>wheels</code>) et §7.13.3 (exemple <code>mass</code>)</p>
<div class="two-col">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>part def Vehicle {
    part wheels[4..8];
    attribute mass : Real default 1500.0;
}
</code></pre>
<ul>
<li><code>wheels</code> est un feature de type <code>part</code>, avec sa multiplicité <code>[4..8]</code></li>
<li><code>mass</code> est un feature de type <code>attribute</code>, typé par <code>Real</code>, avec une valeur par défaut</li>
</ul>
</div>
<div>
<p><strong>Une seule notion pour tout ce qu'UML sépare</strong></p>
<ul>
<li>Attribut (<code>attribute</code>), port (<code>port</code>), paramètre (<code>in</code>/<code>out</code>), extrémité d'association — tous des <code>Feature</code> en KerML, avec la même mécanique de typage, multiplicité, subsetting et redéfinition</li>
<li>En UML, <code>Property</code> couvre déjà attribut + association-end, mais pas port ni paramètre de la même façon — <code>Feature</code> unifie tout ça une seule fois, à un seul niveau</li>
</ul>
</div>
</div>
<div class="takeaway"><code>Feature</code> = tout ce qu'un élément possède et qui se type, se compte et se redéfinit — attribut, port, paramètre, extrémité de relation, tout y passe.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="8" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="item-part-attribute--lequel-utiliser"><code>item</code>, <code>part</code>, <code>attribute</code> : lequel utiliser ?</h1>
<p style="font-size:0.6em;color:#888;">Source : SysML v2.0, §7.10.1 « Items Overview », §7.10.2 (exemple <code>Fuel</code>), §7.11.1 « Parts Overview »</p>
<div class="two-col">
<div>
<p><strong>La question à se poser : est-ce une donnée, ou une chose qui existe dans le temps ?</strong></p>
<ul>
<li><strong><code>attribute</code></strong> : une valeur de données (nombre, quantité, texte) — n'a pas d'identité propre, ne peut pas être « connectée » ni « détruite »</li>
<li><strong><code>item</code></strong> : une chose identifiable qui peut être agie sur dans le temps (matière, signal, donnée qui circule) — mais qui n'agit pas forcément elle-même</li>
<li><strong><code>part</code></strong> : un <code>item</code> qui, en plus, peut lui-même effectuer des actions (comportement propre) — <strong>tout <code>part</code> est un <code>item</code>, l'inverse est faux</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>item def Fuel {
    attribute pressure : PressureValue;
    ref item impurities[0..*] : Material;
}
</code></pre>
</div>
<div>
<p><strong>Pourquoi <code>wheels</code> est un <code>part</code> et <code>mass</code> un <code>attribute</code></strong></p>
<ul>
<li><code>wheels</code> a une existence physique propre : on peut la connecter, la remplacer, elle a un cycle de vie — c'est une occurrence structurelle → <code>part</code></li>
<li><code>mass</code> est juste une valeur numérique portée par <code>vehicle</code> : elle n'a pas d'identité indépendante, seulement une valeur qui peut changer → <code>attribute</code></li>
</ul>
<p><strong>Le même « Fuel » peut être les deux selon le rôle</strong></p>
<ul>
<li>Le spec le dit explicitement : le carburant qui circule est un <code>item</code> (<code>item def Fuel</code>) ; un moteur en cours d'assemblage est un <code>item</code> sur la chaîne, mais devient un <code>part</code> une fois monté dans le véhicule — le même objet change de rôle, pas de nature</li>
</ul>
</div>
</div>
<div class="takeaway">Donnée sans identité → <code>attribute</code> · chose qui circule/existe → <code>item</code> · chose qui agit elle-même → <code>part</code> (qui est toujours aussi un <code>item</code>).</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="9" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="exemple--specialization-subsetting-redefinition">Exemple · Specialization, Subsetting, Redefinition</h1>
<p style="font-size:0.6em;color:#888;">Source : SysML v2.0, §7.6.1 (Vehicle/Truck), §7.6.3 (syntaxe et équivalence symbole/mot-clé), §7.7 (Person/mother)</p>
<div class="box y">
Piège : <code>:&gt;</code> a <strong>deux sens</strong> — entre deux <code>def</code>, il abrège <code>specializes</code> (hérite tout) ; sur un feature d'usage, il abrège <code>subsets</code> (restreint). Même symbole, deux emplois.
</div>
<div class="two-col">
<div>
<p><strong>Specialization — entre deux <code>def</code>, <code>:&gt;</code> = <code>specializes</code></strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>part def Truck :&gt; Vehicle;
</code></pre>
<p><code>Truck</code> hérite <code>wheels[4..8]</code> et <code>mass</code> tels quels — comme une <code>Generalization</code> UML.</p>
<p><strong>Subsetting — sur un feature, <code>:&gt;</code> = <code>subsets</code></strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>item def Person {
    ref item parent[2] : Person;
    ref item mother : Person[1..1] :&gt; parent;
}
</code></pre>
</div>
<div>
<p><strong>Redefinition — <code>:&gt;&gt;</code> = <code>redefines</code></strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>part def Engine {
    part cylinders : Cylinder[2..*];
}
part def FourCylinderEngine :&gt; Engine {
    part :&gt;&gt; cylinders[4];
}
</code></pre>
<p><code>FourCylinderEngine</code> hérite <code>cylinders</code>, mais le remplace par une version plus contrainte (<code>[4]</code> au lieu de <code>[2..*]</code>).</p>
<p><strong>UML ne généralise pas ce mécanisme</strong> : <code>redefinedProperty</code> n'existe que pour <code>Property</code> ; <code>:&gt;&gt;</code> marche pour tout <code>Feature</code> (part, port, action…).</p>
</div>
</div>
<div class="takeaway">Entre deux <code>def</code> : <code>:&gt;</code> = <code>specializes</code>. Sur un feature : <code>:&gt;</code> = <code>subsets</code>, <code>:&gt;&gt;</code> = <code>redefines</code>.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="10" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="exemple--occurrence-succession-flow">Exemple · Occurrence, Succession, Flow</h1>
<p style="font-size:0.6em;color:#888;">Source : SysML v2.0, §7.6.6 « Feature Chains » ; Cas 3 (<code>Connector</code>), Cas 4 (<code>Flow</code>), Cas 7 (<code>SuccessionFlow</code>) plus loin dans ce plan</p>
<div class="two-col">
<div>
<p><strong>Occurrence — une chose qui existe dans le temps</strong></p>
<ul>
<li><code>vehicle</code>, <code>wheelAssembly</code>, <code>wheels</code> sont chacun des occurrences : ils peuvent être créés, connectés, détruits — pas juste des valeurs statiques comme une <code>InstanceSpecification</code> UML</li>
</ul>
<p><strong>Connexion entre occurrences</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>connect vehicle.wheelAssembly.wheels
    to vehicle.road;
</code></pre>
</div>
<div>
<p><strong>Succession et Flow — ordonner et faire circuler</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>succession flow focus.image
    to shoot.image;
</code></pre>
<ul>
<li><code>Succession</code> : « ceci se termine avant que cela commence » — enrichit <code>ControlFlow</code> UML</li>
<li><code>Flow</code> : transfert d'un item d'une occurrence à une autre — enrichit <code>ObjectFlow</code> UML</li>
<li>Les deux combinés (<code>succession flow</code>) : l'ordre ET le transfert en une seule relation</li>
</ul>
</div>
</div>
<div class="takeaway">Une occurrence est une chose qui existe et évolue ; succession l'ordonne, flow fait circuler quelque chose entre occurrences.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="11" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="requirement--un-pilier-sysml-sans-%C3%A9quivalent-uml-natif"><code>Requirement</code> — un pilier SysML sans équivalent UML natif</h1>
<p style="font-size:0.6em;color:#888;">Source : SysML v2.0, §7.21.1 « Requirements Overview », §7.21.2 (exemple <code>BrakingRequirement</code>)</p>
<div class="two-col">
<div>
<p><strong>Une exigence est un <code>def</code>/usage comme les autres</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>requirement def BrakingRequirement {
    subject vehicle : Vehicle;
    actor environment : 'Driving Environment';
    stakeholder driver : Person;

    attribute speedLimit : SpeedValue;

    assume constraint {
        doc /* Les conditions
        environnementales sont mauvaises. */
    }
}
</code></pre>
</div>
<div>
<p><strong>Pourquoi UML n'a rien d'équivalent</strong></p>
<ul>
<li>UML n'a pas de notion native de « sujet », « acteur » ou « partie prenante » d'une exigence — au mieux, un profil SysML v1 ajouté par-dessus</li>
<li><code>RequirementUsage</code> porte cette structure nativement (attributs <code>reqId</code>, <code>text</code>, <code>subject</code>, <code>actor</code>, <code>stakeholder</code>) et se compose avec le reste du modèle comme n'importe quel usage</li>
<li>Une exigence peut être satisfaite par un usage concret : <code>satisfy requirement braking : BrakingRequirement by vehicle1;</code> (revu au Cas 32, <code>SatisfyRequirementUsage</code>)</li>
</ul>
</div>
</div>
<div class="takeaway">Ce concept réapparaît plus loin (Cas 32) sans être ré-expliqué — à garder en tête : une exigence est structurée nativement, pas juste annotée.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="section theme-mint" lang="en-US" class="section theme-mint" data-marpit-pagination="12" style="--paginate:true;--class:section theme-mint;" data-marpit-pagination-total="65">
<h1 id="partie-2--le-point-de-greffe-sur-linfrastructure-modelio">Partie 2 · Le point de greffe sur l'infrastructure Modelio</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="13" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="r%C3%A9solu--le-point-de-greffe-est-modelelement">Résolu : le point de greffe est ModelElement</h1>
<div class="box m">
<strong>Confirmé</strong> par l'inspection directe du métamodèle d'infrastructure Modelio (19 classes, package <code>infrastructure</code>) : <code>Element</code> est la racine ultime, abstraite, de Modelio. <code>ModelElement</code> en est un sous-type direct. Et surtout : <strong>16 des 17 autres classes d'infrastructure étendent ModelElement, aucune n'étend Element directement.</strong>
</div>
<p><img src="media/modelio_infrastructure.png" alt="Les 19 classes du package infrastructure Modelio" /></p>
<p><span class="chip">Les 19 classes du package infrastructure</span> — vue complète, aucune omise.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="14" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="le-pr%C3%A9c%C3%A9dent-le-plus-pertinent--limpl%C3%A9mentation-uml-de-modelio">Le précédent le plus pertinent : l'implémentation UML de Modelio</h1>
<div class="box m">
SysML/KerML est structurellement bien plus proche d'UML que de tout autre métamodèle Modelio. Modelio a sa propre implémentation d'UML (package <code>standard</code>), avec sa propre greffe sur l'infrastructure.
</div>
<p><img src="media/uml_precedent.png" alt="UmlModelElement -&gt; ModelElement et Project -&gt; AbstractProject" /></p>
<div class="takeaway"><code>UmlModelElement -&gt; ModelElement</code> et <code>Project (UML) -&gt; AbstractProject</code> — pas un cas isolé. <strong>AbstractProject</strong> a des sous-types directs à travers plusieurs métamodèles Modelio chargés (UML, Impact, Review, Analyst, Module) : c'est la convention établie, pas une exception.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="15" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="ce-que-%C3%A7a-change-pour-la-greffe--et-pour-le-nommage">Ce que ça change pour la greffe — et pour le nommage</h1>
<div class="two-col">
<div>
<p><strong>Le point de greffe</strong></p>
<ul>
<li>Renommer, dans <code>implementation</code> uniquement, la classe <code>Element</code><br />
de KerML en <code>KerMLModelElement</code></li>
<li>Conserver la chaîne générée <code>KerMLModelElement</code> via <code>EObject</code>/<code>MObject</code> et <code>SmObjectImpl</code><br />
directement</li>
</ul>
</div>
<div>
<p><strong>Le point de projet</strong></p>
<ul>
<li>Introduire <code>SysMLProject extends AbstractProject</code>, sur le même<br />
patron que <code>Project</code> (UML)</li>
<li>Nommé côté SysML, pas KerML : il n'y aura pas d'éditeur KerML<br />
autonome, seulement un éditeur SysML v2 — KerML reste la couche<br />
fondationnelle greffée en interne, mais n'a pas sa propre<br />
surface de projet</li>
</ul>
</div>
</div>
<div class="takeaway">UML lui-même a un concept natif « Element » (racine du métamodèle OMG UML). Modelio le renomme directement en <code>UmlModelElement</code>, sans couche d'indirection. Même geste pour KerML : renommer directement.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="section theme-poussin" lang="en-US" class="section theme-poussin" data-marpit-pagination="16" style="--paginate:true;--class:section theme-poussin;" data-marpit-pagination-total="65">
<h1 id="partie-3--chevauchements-avec-linfrastructure-modelio">Partie 3 · Chevauchements avec l'infrastructure Modelio</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="17" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="trois-chevauchements-concrets-entre-kerml-et-linfrastructure">Trois chevauchements concrets entre KerML et l'infrastructure</h1>
<div class="box y">
Recensement fait à partir des 182 classes de <code>reference</code> comparées aux 19 classes d'infrastructure Modelio, texte de spec à l'appui. Le principe est simple : ne pas réimplémenter dans <strong>implementation</strong> ce que l'infrastructure fait déjà nativement — trois candidats concrets, détaillés sur les slides suivantes.
</div>
<table>
<thead>
<tr>
<th>Concept KerML</th>
<th>Infrastructure Modelio</th>
<th>Nature du chevauchement</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Comment</code>, <code>Documentation</code></td>
<td><code>Note</code></td>
<td>Même rôle : annoter un élément avec du texte libre</td>
</tr>
<tr>
<td><code>Dependency</code></td>
<td><code>Dependency</code></td>
<td><strong>Collision de nom ET de concept</strong></td>
</tr>
<tr>
<td><code>MetadataDefinition</code>/<code>MetadataUsage</code></td>
<td><code>Stereotype</code> + <code>TaggedValue</code></td>
<td>Même rôle architectural : métadonnées typées attachées à un élément</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="18" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="chevauchement-1a--comment-%E2%86%94-note">Chevauchement 1a · <code>Comment</code> <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/> <code>Note</code></h1>
<p style="font-size:0.6em;color:#888;margin:0 0 6px 0;">Source : OMG SysML v2.0 Part 1 (formal/2025-09-01), clause 7.4.2 "Comments and Documentation", p.21-22</p>
<div class="box m">
<code>Comment</code> (sous-type d'<code>AnnotatingElement</code>) : « whose body in some way describes its annotatedElements. » Un attribut porteur : <code>body : String [1..1]</code>, plus <code>locale</code> optionnel.
</div>
<div class="two-col">
<div>
<p><strong>Forme explicite, avec cible nommée</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>item A;
part B;
comment Comment1 about A, B
    /* This is the comment
    body text. */
</code></pre>
</div>
<div>
<p><strong>Forme implicite (membre d'un package) et avec locale</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>package P {
    comment C /* This is a
    comment about P. */
}

comment C_US_English
    locale &quot;en_US&quot;
    /* This is US English
    comment text */
</code></pre>
</div>
</div>
<div class="takeaway">Trois formes, un seul besoin : texte libre attaché à un élément, avec ou sans cible explicite, avec ou sans langue. <code>Note</code> de Modelio couvre déjà tout ce rôle.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="19" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="chevauchement-1b--documentation-%E2%86%94-note">Chevauchement 1b · <code>Documentation</code> <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/> <code>Note</code></h1>
<p style="font-size:0.6em;color:#888;margin:0 0 6px 0;">Source : OMG SysML v2.0 Part 1 (formal/2025-09-01), clause 7.4.2 "Comments and Documentation", p.22</p>
<div class="box m">
<code>Documentation</code> (sous-type de <code>Comment</code>, aucun attribut propre) : « specifically documents a documentedElement, which must be its owner. » Spécialisation par <strong>contrainte</strong> (l'élément documenté doit être le propriétaire), pas par structure.
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>part X {
    doc X_Comment
        /* This is a documentation comment about X. */
    doc /* This is more documentation about X. */
}
</code></pre>
<div class="takeaway">Même syntaxe que <code>comment</code>, mot-clé <code>doc</code> à la place — l'élément documenté est toujours le propriétaire, jamais besoin d'un <code>about</code> explicite. Aucune nouvelle classe à créer dans <strong>implementation</strong> : <code>Comment</code> et <code>Documentation</code> se mappent sur <code>Note</code>.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="20" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="chevauchement-2--dependency-%E2%86%94-dependency">Chevauchement 2 · <code>Dependency</code> <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/> <code>Dependency</code></h1>
<p style="font-size:0.6em;color:#888;margin:0 0 6px 0;">Source : OMG SysML v2.0 Part 1 (formal/2025-09-01), clause 7.3.2 "Dependency Declaration", p.18-19</p>
<div class="box y">
Collision de <strong>nom ET de concept</strong> — le seul des trois cas où les deux définitions se lisent presque mot pour mot de la même façon.
</div>
<p><strong><code>Dependency</code></strong> (sous-type de <code>Relationship</code>, aucun attribut propre) : « indicates that one or more client Elements require one or more supplier Elements for their complete specification. »</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>dependency Use
    from 'Application Layer' to 'Service Layer';

// forme non nommée, n-aire :
dependency 'Service Layer' to 'Data Layer', 'External Interface Layer';
</code></pre>
<div class="takeaway">Aucune structure propre à réconcilier — c'est le cas le plus net des trois. <code>Dependency</code> de KerML devrait être un alias direct de <code>Dependency</code> de Modelio.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="21" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="chevauchement-3a--metadatadefinition-%E2%86%94-stereotype">Chevauchement 3a · <code>MetadataDefinition</code> <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/> <code>Stereotype</code></h1>
<p style="font-size:0.6em;color:#888;margin:0 0 6px 0;">Source : OMG SysML v2.0 Part 1 (formal/2025-09-01), clause 7.27.2 "Metadata Definitions and Usages", p.159</p>
<div class="box m">
<code>MetadataDefinition</code> (<code>ItemDefinition</code> <strong>et</strong> <code>Metaclass</code>) : « an ItemDefinition that is also a Metaclass » — définit le <em>type</em> des métadonnées, comme un <code>Stereotype</code> définit le type d'une extension.
</div>
<p><strong>Déclarée comme une définition d'item, avec le mot-clé <code>metadata def</code> :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>metadata def SecurityRelated;

metadata def ApprovalAnnotation {
    attribute approved : Boolean;
    attribute approver : String;
}
</code></pre>
<div class="takeaway">Une définition vide (marqueur pur) ou porteuse d'attributs typés — exactement ce qu'un <code>Stereotype</code> Modelio fait déjà, avec ses <code>TagType</code> pour chaque attribut.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="22" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="chevauchement-3b--metadatausage-%E2%86%94-taggedvalue">Chevauchement 3b · <code>MetadataUsage</code> <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/> <code>TaggedValue</code></h1>
<p style="font-size:0.6em;color:#888;margin:0 0 6px 0;">Source : OMG SysML v2.0 Part 1 (formal/2025-09-01), clause 7.27.2 "Metadata Definitions and Usages", p.159-160</p>
<div class="two-col">
<div>
<p><strong>Explicite, avec cible(s) et valeurs</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>metadata securityDesignAnnotation
    : SecurityRelated
    about SecurityRequirements,
          SecurityDesign;

metadata ApprovalAnnotation
    about Design {
    ref :&gt;&gt; approved = true;
    ref :&gt;&gt; approver = &quot;John Smith&quot;;
}
</code></pre>
</div>
<div>
<p><strong>Raccourcis : <code>ref</code>/<code>redefines</code> implicite, cible implicite, symbole <code>@</code></strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>metadata ApprovalAnnotation
    about Design {
    approved = true;
    approver = &quot;John Smith&quot;;
}

part def Design {
    // implicitement about Design
    @ApprovalAnnotation {
        approved = true;
        approver = &quot;John Smith&quot;;
    }
}
</code></pre>
</div>
</div>
<div class="takeaway">C'est le chevauchement le plus <strong>architecturalement significatif</strong> des trois — pas une seule classe, tout un sous-système à ne pas dupliquer dans <strong>implementation</strong>.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-class="section theme-mint" lang="en-US" class="section theme-mint" data-marpit-pagination="23" style="--paginate:true;--class:section theme-mint;" data-marpit-pagination-total="65">
<h1 id="partie-4--r%C3%A9soudre-lh%C3%A9ritage-multiple-de-kerml-en-java">Partie 4 · Résoudre l'héritage multiple de KerML en Java</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="24" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="java-na-pas-dh%C3%A9ritage-multiple--kerml-si--34-classes-concern%C3%A9es">Java n'a pas d'héritage multiple — KerML, si : 34 classes concernées</h1>
<div class="box y">
Java 17 : une classe peut <strong>implémenter</strong> plusieurs interfaces, mais ne peut <strong>étendre</strong> qu'une seule classe. Recensement complet sur le package <code>reference</code> (182 classes) : <strong>34 classes ont 2 super-types directs</strong> — de vraies généralisations <strong>orthogonales</strong>, pas des diamants (une, <code>FlowUsage</code>, en a même 3).
</div>
<div class="two-col">
<div>
<p><code>ActionDefinition</code> → OccurrenceDefinition, Behavior<br />
<code>ActionUsage</code> → OccurrenceUsage, Step<br />
<code>AssertConstraintUsage</code> → ConstraintUsage, Invariant<br />
<code>Association</code> → Relationship, Classifier<br />
<code>AssociationStructure</code> → Structure, Association<br />
<code>AttributeDefinition</code> → Definition, DataType<br />
<code>BindingConnectorAsUsage</code> → ConnectorAsUsage, BindingConnector<br />
<code>CalculationDefinition</code> → ActionDefinition, Function<br />
<code>CalculationUsage</code> → ActionUsage, Expression<br />
<code>ConnectionDefinition</code> → PartDefinition, AssociationStructure<br />
<code>ConnectionUsage</code> → PartUsage, ConnectorAsUsage<br />
<code>Connector</code> → Relationship, Feature<br />
<code>ConnectorAsUsage</code> → Usage, Connector<br />
<code>ConstraintDefinition</code> → OccurrenceDefinition, Predicate<br />
<code>ConstraintUsage</code> → OccurrenceUsage, BooleanExpression<br />
<code>ExhibitStateUsage</code> → PerformActionUsage, StateUsage<br />
<code>Flow</code> → Connector, Step</p>
</div>
<div>
<p><code>FlowDefinition</code> → ActionDefinition, Interaction<br />
<code>FlowUsage</code> → ConnectorAsUsage, ActionUsage, Flow <strong>(3 parents)</strong><br />
<code>IncludeUseCaseUsage</code> → PerformActionUsage, UseCaseUsage<br />
<code>Interaction</code> → Association, Behavior<br />
<code>ItemDefinition</code> → OccurrenceDefinition, Structure<br />
<code>MembershipExpose</code> → Expose, MembershipImport<br />
<code>MetadataDefinition</code> → ItemDefinition, Metaclass<br />
<code>MetadataFeature</code> → AnnotatingElement, Feature<br />
<code>MetadataUsage</code> → ItemUsage, MetadataFeature<br />
<code>NamespaceExpose</code> → Expose, NamespaceImport<br />
<code>OccurrenceDefinition</code> → Definition, Class<br />
<code>PerformActionUsage</code> → EventOccurrenceUsage, ActionUsage<br />
<code>PortDefinition</code> → OccurrenceDefinition, Structure<br />
<code>SatisfyRequirementUsage</code> → AssertConstraintUsage, RequirementUsage<br />
<code>SuccessionAsUsage</code> → ConnectorAsUsage, Succession<br />
<code>SuccessionFlow</code> → Succession, Flow<br />
<code>SuccessionFlowUsage</code> → FlowUsage, SuccessionFlow</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="25" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="approche-recommand%C3%A9e--axe-primaire--interface-d%C3%A9l%C3%A9gu%C3%A9e">Approche recommandée : axe primaire + interface déléguée</h1>
<div class="box m">
Retenue face à « décider au cas par cas » et « dupliquer l'état », écartées pour manque de cohérence/réutilisation : l'axe qui appartient à la lignée <strong>Definition/Usage</strong> gagne toujours <code>extends</code> ; l'autre axe devient une interface <code>mm.api</code>, implémentée par délégation à un petit objet interne qui porte son état.
</div>
<div class="two-col">
<div>
<p><strong>Pourquoi Definition/Usage prime</strong></p>
<ul>
<li>C'est l'axe organisateur de tout SysML : chaque concept que l'utilisateur écrit est soit un <code>def</code>, soit un usage — pas une variante parmi d'autres</li>
<li>Il porte la mécanique structurelle lourde partout réutilisée : possession (une Definition possède ses Usages), typage, redéfinition (<code>:&gt;&gt;</code>) — qui a besoin d'un vrai héritage Java, pas d'un simple contrat</li>
<li>L'axe secondaire (DataType, Behavior, Structure…) ajoute un rôle sémantique ponctuel, pas la colonne vertébrale par laquelle le modèle est navigué</li>
</ul>
</div>
<div>
<p><strong><code>AttributeDefinition -&gt; Definition, DataType</code></strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">AttributeDefinition</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Definition</span>, DataType { }   <span class="hljs-comment">// mm.api</span>

<span class="hljs-keyword">class</span> <span class="hljs-title class_">AttributeDefinitionImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">DefinitionImpl</span>             <span class="hljs-comment">// mm.impl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">AttributeDefinition</span> {
    <span class="hljs-keyword">private</span> DataTypeBehavior dataType; <span class="hljs-comment">// délégué</span>
    <span class="hljs-keyword">public</span> <span class="hljs-comment">/* DataType */</span> ... { <span class="hljs-keyword">return</span> dataType.xxx(); }
}
</code></pre>
</div>
</div>
<div class="takeaway"><code>Definition</code> gagne <code>extends</code> car c'est l'axe structurel ; <code>DataType</code> devient une interface déléguée car c'est un rôle transversal.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="26" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="les-34-cas-un-par-un">Les 34 cas, un par un</h1>
<div class="box y">
Pour chacun : la description du concept et de ses super-types (extraite de la spec, via les Notes du modèle <code>reference</code>), son chemin qualifié, ce qu'il hérite de chaque parent (attributs, opérations, comportement), puis la résolution — quel super-type gagne <code>extends</code>, lequel devient une interface <code>mm.api</code> déléguée.
</div>
<div class="box m">
Rappel Java : <code>implements</code> ne s'applique qu'à des interfaces. Ça tient ici parce que <strong>chaque concept KerML génère à la fois une interface</strong> (<code>Association</code>, <code>DataType</code>…) <strong>et sa classe d'implémentation</strong> (<code>AssociationImpl</code>…) — voir la slide « Approche recommandée ». Sur les 34 slides suivantes, <code>implements X</code> vise toujours l'interface <code>X</code>, jamais une classe.
</div>
<div class="takeaway">34 slides suivent, une par cas — même format, même logique de décision. Chemins qualifiés abrégés (préfixe <code>modelio.sysml2::reference::</code> omis). Ordre : d'abord les <strong>7 cas KerML</strong> (cas 1-7 — le noyau, sur lequel SysML se construit), puis les <strong>27 cas SysML</strong> (cas 8-34).</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="27" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-1--association">Cas 1 · <code>Association</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>Association</code></strong> <em>(KerML::Kernel::Associations)</em> — Relationship et Classifier, pour classifier des liens entre choses.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>assoc Ownership { end owner[1]:LegalEntity; end ownedAsset[1]:Asset; }
</code></pre>
<p><strong>Super-type primaire : <code>Relationship</code></strong> <em>(KerML::Root::Elements)</em> — Element qui relie d'autres Elements. Hérite : attribut <code>isImplied</code> ; opérations <code>libraryNamespace</code>, <code>path</code>.</p>
<p><strong>Super-type secondaire : <code>Classifier</code></strong> <em>(KerML::Core::Classifiers)</em> — Type qui classifie des choses ou leurs relations via Features.</p>
</div>
<div>
<div class="box y">Ni <code>Relationship</code> ni <code>Classifier</code> n'appartient à la lignée Definition/Usage — deux concepts-noyau à égalité.</div>
<div class="takeaway"><code>extends Relationship</code> ; <code>implements Classifier</code>, délégué — l'identité première d'une association est de relier des éléments.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">Association</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Relationship</span>, Classifier { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">AssociationImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">RelationshipImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Classifier</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="28" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-2--associationstructure">Cas 2 · <code>AssociationStructure</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>AssociationStructure</code></strong> <em>(KerML::Kernel::Associations)</em> — Association qui est aussi une Structure, classifiant des objets-liens.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>assoc struct ExtendedAssetOwnership { end feature owner:LegalEntity crosses ownedAsset.owningEntities; }
</code></pre>
<p><strong>Super-type primaire : <code>Association</code></strong> <em>(KerML::Kernel::Associations)</em> — déjà résolu au cas 1 — hérite : état de <code>Relationship</code> (<code>isImplied</code>) + rôle <code>Classifier</code> délégué.</p>
<p><strong>Super-type secondaire : <code>Structure</code></strong> <em>(KerML::Kernel::Structures)</em> — Class d'objets principalement structurels dans l'univers modélisé.</p>
</div>
<div>
<div class="box y">Correction : <code>Association</code> a déjà un état réel (cas 1) — elle ne peut pas redevenir secondaire ici. C'est elle qui gagne <code>extends</code>.</div>
<div class="takeaway"><code>extends Association</code> ; <code>implements Structure</code>, délégué — état réel déjà hérité (cas 1) — Association ne peut pas redevenir secondaire ici.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">AssociationStructure</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Association</span>, Structure { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">AssociationStructureImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">AssociationImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Structure</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="29" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-3--connector">Cas 3 · <code>Connector</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>Connector</code></strong> <em>(KerML::Kernel::Connectors)</em> — usage d'Associations, liens restreints selon le Type dans lequel il est utilisé.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>connector vehicle.wheelAssembly.wheels to vehicle.road;
</code></pre>
<p><strong>Super-type primaire : <code>Feature</code></strong> <em>(KerML::Core::Features)</em> — Type qui classifie des relations entre plusieurs choses. Hérite : 9 attributs (<code>direction</code>, <code>isComposite</code>, <code>isDerived</code>, <code>isOrdered</code>, <code>isUnique</code>…) + opérations de typage/redéfinition (<code>redefines</code>, <code>subsetsChain</code>, <code>typingFeatures</code>…).</p>
<p><strong>Super-type secondaire : <code>Relationship</code></strong> <em>(KerML::Root::Elements)</em> — déjà décrit au cas 1 — Element qui relie d'autres Elements.</p>
</div>
<div>
<div class="box y">Ni l'un ni l'autre n'appartient à la lignée Definition/Usage — cas-noyau, comme <code>Association</code>.</div>
<div class="takeaway"><code>extends Feature</code> ; <code>implements Relationship</code>, délégué — typage/redéfinition, essentiels partout, priment.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">Connector</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Feature</span>, Relationship { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">ConnectorImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">FeatureImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Relationship</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="30" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-4--flow">Cas 4 · <code>Flow</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>Flow</code></strong> <em>(KerML::Kernel::Interactions)</em> — Step représentant le transfert de valeurs d'une Feature à une autre, pouvant prendre du temps.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>flow fuelTank.fuelOut to engine.fuelIn;
</code></pre>
<p><strong>Super-type primaire : <code>Connector</code></strong> <em>(KerML::Kernel::Connectors)</em> — déjà résolu au cas 3 — hérite : état de <code>Feature</code> + rôle <code>Relationship</code> délégué.</p>
<p><strong>Super-type secondaire : <code>Step</code></strong> <em>(KerML::Kernel::Behaviors)</em> — Feature typée par un ou plusieurs Behaviors, comportement d'ordonnancement temporel.</p>
</div>
<div>
<div class="takeaway"><code>extends Connector</code> ; <code>implements Step</code>, délégué — un flow est avant tout un connecteur spécialisé.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">Flow</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Connector</span>, Step { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">FlowImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">ConnectorImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Step</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="31" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-5--interaction">Cas 5 · <code>Interaction</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>Interaction</code></strong> <em>(KerML::Kernel::Interactions)</em> — Behavior qui est aussi une Association, contexte pour objets aux comportements interdépendants.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>interaction Authorization { end feature client[*]:Computer; end feature server[*]:Computer; }
</code></pre>
<p><strong>Super-type primaire : <code>Behavior</code></strong> <em>(KerML::Kernel::Behaviors)</em> — coordonne des occurrences d'autres Behaviors, décomposable en Steps, paramétrable.</p>
<p><strong>Super-type secondaire : <code>Association</code></strong> <em>(KerML::Kernel::Associations)</em> — déjà résolu au cas 1 — hérite : état de <code>Relationship</code> + rôle <code>Classifier</code> délégué.</p>
</div>
<div>
<div class="box y">Ni l'un ni l'autre n'appartient à la lignée Definition/Usage — cas-noyau.</div>
<div class="takeaway"><code>extends Behavior</code> ; <code>implements Association</code>, délégué — le comportement (exécution, séquencement) prime.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">Interaction</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Behavior</span>, Association { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">InteractionImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">BehaviorImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Association</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="32" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-6--metadatafeature">Cas 6 · <code>MetadataFeature</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>MetadataFeature</code></strong> <em>(KerML::Kernel::Metadata)</em> — Feature qui est une AnnotatingElement, utilisée pour annoter un Element avec des métadonnées. Hérite : opérations <code>evaluateFeature</code>, <code>isSemantic</code>, <code>isSyntactic</code>, <code>syntaxElement</code>.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>metadata securityDesignAnnotation : SecurityRelated about SecurityDesign;
</code></pre>
<p><strong>Super-type primaire : <code>Feature</code></strong> <em>(KerML::Core::Features)</em> — déjà décrit au cas 3 — 9 attributs + opérations de typage/redéfinition.</p>
<p><strong>Super-type secondaire : <code>AnnotatingElement</code></strong> <em>(KerML::Root::Annotations)</em> — Element fournissant une description/métadonnée additionnelle sur un autre Element.</p>
</div>
<div>
<div class="takeaway"><code>extends Feature</code> ; <code>implements AnnotatingElement</code>, délégué — typage/redéfinition prime.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">MetadataFeature</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Feature</span>, AnnotatingElement { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">MetadataFeatureImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">FeatureImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">AnnotatingElement</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="33" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-7--successionflow">Cas 7 · <code>SuccessionFlow</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>SuccessionFlow</code></strong> <em>(KerML::Kernel::Interactions)</em> — Flow fournissant aussi un ordre temporel (transferts contraints dans le temps).</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>succession flow focus.image to shoot.image;
</code></pre>
<p><strong>Super-type primaire : <code>Flow</code></strong> <em>(KerML::Kernel::Interactions)</em> — déjà résolu au cas 4 — hérite : état de <code>Connector</code> + rôle <code>Step</code> délégué.</p>
<p><strong>Super-type secondaire : <code>Succession</code></strong> <em>(KerML::Kernel::Connectors)</em> — décrit plus loin au cas 33 — ordre temporel séparé exigé.</p>
</div>
<div>
<div class="takeaway"><code>extends Flow</code> ; <code>implements Succession</code>, délégué — un succession-flow est avant tout un flow spécialisé.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">SuccessionFlow</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Flow</span>, Succession { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">SuccessionFlowImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">FlowImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Succession</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="34" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-8--actiondefinition">Cas 8 · <code>ActionDefinition</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>ActionDefinition</code></strong> <em>(SysML::Systems::Actions)</em> — Definition qui est aussi un Behavior, définissant une action réalisée par un système.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>action def Braking { in vehicle : Vehicle; }
</code></pre>
<p><strong>Super-type primaire : <code>OccurrenceDefinition</code></strong> <em>(SysML::Systems::Occurrences)</em> — Definition d'une classe d'individus à vie propre dans le temps. Hérite : attribut <code>isIndividual</code>.</p>
<p><strong>Super-type secondaire : <code>Behavior</code></strong> <em>(KerML::Kernel::Behaviors)</em> — coordonne des occurrences d'autres Behaviors. Hérite : comportement de décomposition en Steps, paramétrable.</p>
</div>
<div>
<div class="takeaway"><code>extends OccurrenceDefinition</code> ; <code>implements Behavior</code>, délégué — le comportement générique est un rôle, pas l'identité structurelle.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">ActionDefinition</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">OccurrenceDefinition</span>, Behavior { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">ActionDefinitionImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">OccurrenceDefinitionImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Behavior</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="35" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-9--actionusage">Cas 9 · <code>ActionUsage</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>ActionUsage</code></strong> <em>(SysML::Systems::Actions)</em> — Usage qui est aussi un Step, typé par un Behavior. Hérite : opérations <code>inputParameters</code>, <code>argument</code>, <code>isSubactionUsage</code>.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>action brake : Braking;
</code></pre>
<p><strong>Super-type primaire : <code>OccurrenceUsage</code></strong> <em>(SysML::Systems::Occurrences)</em> — Usage dont tous les types sont des Class. Hérite : attributs <code>isIndividual</code>, <code>portionKind</code>.</p>
<p><strong>Super-type secondaire : <code>Step</code></strong> <em>(KerML::Kernel::Behaviors)</em> — Feature typée par un ou plusieurs Behaviors, ordonnable dans le temps, connectable par Flows.</p>
</div>
<div>
<div class="takeaway"><code>extends OccurrenceUsage</code> ; <code>implements Step</code>, délégué — même logique que <code>ActionDefinition</code>, côté usage.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">ActionUsage</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">OccurrenceUsage</span>, Step { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">ActionUsageImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">OccurrenceUsageImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Step</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="36" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-10--assertconstraintusage">Cas 10 · <code>AssertConstraintUsage</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>AssertConstraintUsage</code></strong> <em>(SysML::Systems::Constraints)</em> — ConstraintUsage qui est aussi un Invariant, asserté vrai par défaut.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>assert constraint { speed &lt;= speedLimit }
</code></pre>
<p><strong>Super-type primaire : <code>ConstraintUsage</code></strong> <em>(SysML::Systems::Constraints)</em> — OccurrenceUsage qui est aussi une BooleanExpression, typée par un Predicate. Hérite : opérations <code>modelLevelEvaluable</code>, <code>namingFeature</code>.</p>
<p><strong>Super-type secondaire : <code>Invariant</code></strong> <em>(KerML::Kernel::Expressions)</em> — BooleanExpression assertée avoir une valeur booléenne précise. Hérite : attribut <code>isNegated</code>.</p>
</div>
<div>
<div class="takeaway"><code>extends ConstraintUsage</code> ; <code>implements Invariant</code>, délégué — la contrainte porte la structure, l'invariant est un rôle sémantique.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">AssertConstraintUsage</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">ConstraintUsage</span>, Invariant { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">AssertConstraintUsageImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">ConstraintUsageImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Invariant</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="37" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-11--attributedefinition">Cas 11 · <code>AttributeDefinition</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>AttributeDefinition</code></strong> <em>(SysML::Systems::Attributes)</em> — Definition et DataType d'une information sur une qualité, sans identité indépendante.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>attribute def Mass { attribute value : Real; }
</code></pre>
<p><strong>Super-type primaire : <code>Definition</code></strong> <em>(SysML::Systems::DefinitionAndUsage)</em> — Classifier d'Usages. Hérite : attribut <code>isVariation</code>.</p>
<p><strong>Super-type secondaire : <code>DataType</code></strong> <em>(KerML::Kernel::DataTypes)</em> — Classifier de choses indistinguables sauf par leurs relations à d'autres choses via Features.</p>
</div>
<div>
<div class="takeaway"><code>extends Definition</code> ; <code>implements DataType</code>, délégué — déjà détaillé en exemple (slide « Approche recommandée »).</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">AttributeDefinition</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Definition</span>, DataType { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">AttributeDefinitionImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">DefinitionImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">DataType</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="38" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-12--bindingconnectorasusage">Cas 12 · <code>BindingConnectorAsUsage</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>BindingConnectorAsUsage</code></strong> <em>(SysML::Systems::Connections)</em> — à la fois un BindingConnector et un ConnectorAsUsage.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>bind port1 = port2;
</code></pre>
<p><strong>Super-type primaire : <code>ConnectorAsUsage</code></strong> <em>(SysML::Systems::Connections)</em> — à la fois un Connector et un Usage ; base abstraite pour BindingConnectorAsUsage, SuccessionAsUsage, ConnectionUsage, FlowConnectionUsage. Résolution propre : voir cas 17.</p>
<p><strong>Super-type secondaire : <code>BindingConnector</code></strong> <em>(KerML::Kernel::Connectors)</em> — Connector binaire exigeant que ses relatedFeatures identifient les mêmes valeurs.</p>
</div>
<div>
<div class="takeaway"><code>extends ConnectorAsUsage</code> ; <code>implements BindingConnector</code>, délégué — la sémantique de liaison est un rôle du connecteur.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">BindingConnectorAsUsage</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">ConnectorAsUsage</span>, BindingConnector { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">BindingConnectorAsUsageImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">ConnectorAsUsageImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">BindingConnector</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="39" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-13--calculationdefinition">Cas 13 · <code>CalculationDefinition</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>CalculationDefinition</code></strong> <em>(SysML::Systems::Calculations)</em> — ActionDefinition définissant aussi une Function produisant un résultat.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>calc def ComputeArea { in length:Real; in width:Real; return area:Real = length*width; }
</code></pre>
<p><strong>Super-type primaire : <code>ActionDefinition</code></strong> <em>(SysML::Systems::Actions)</em> — déjà résolu au cas 8 — hérite : état d'<code>OccurrenceDefinition</code> + rôle <code>Behavior</code> délégué.</p>
<p><strong>Super-type secondaire : <code>Function</code></strong> <em>(KerML::Kernel::Functions)</em> — Behavior avec un paramètre out identifié comme résultat. Hérite : attribut <code>isModelLevelEvaluable</code>.</p>
</div>
<div>
<div class="takeaway"><code>extends ActionDefinition</code> ; <code>implements Function</code>, délégué — le rôle fonctionnel est secondaire.</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">CalculationDefinition</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">ActionDefinition</span>, Function { }  <span class="hljs-comment">// mm.api</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">CalculationDefinitionImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">ActionDefinitionImpl</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Function</span> { ... }  <span class="hljs-comment">// mm.impl</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="40" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="cas-14--calculationusage">Cas 14 · <code>CalculationUsage</code></h1>
<div class="two-col">
<div>
<p><strong>Classe : <code>CalculationUsage</code></strong> <em>(SysML::Systems::Calculations)</em> — ActionUsage qui est aussi une Expression, typée par une Function. Hérite : opération <code>modelLevelEvaluable</code>.</p>
<p><strong>Exemple (syntaxe SysML v2/KerML) :</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>area = ComputeArea(length=5, width=3);
</code></pre>
<p><strong>Super-type primaire : <code>ActionUsage</code></strong> <em>(SysML::Systems::Actions)</em> — déjà résolu au cas 9 — hérite : état d'<code>OccurrenceUsage</code> + rôle <code>Step</code> délégué.</p>
<p><strong>Super-type secondaire : <code>Expression</code></strong> <em>(KerML::Kernel::Expressions)</em> — Step typé par une Function, résultat unique. Hérite : attribut <code>isModelLevelEvaluable</code> ; opérations <code>evaluate</code>, <code>checkCondition</code>.</p>
</div>
<div>

<h1 id="cas-34--successionflowusage">Cas 34 · <code>SuccessionFlowUsage</code></h1>
<div class="two-col">

<h1 id="au-bilan--quelles-classes-deviennent-des-interfaces-pures">Au bilan : quelles classes deviennent des interfaces pures</h1>
<div class="box m">
Sur les 34 cas : certaines classes ne gagnent jamais <code>extends</code> nulle part — ce sont des interfaces <code>mm.api</code> pures, jamais un backbone <code>mm.impl</code>. D'autres sont primaires dans leur propre cas mais deviennent un rôle délégué quand un <em>autre</em> cas les utilise — les deux statuts coexistent, ils ne s'appliquent juste pas à la même paire.
</div>
<div class="two-col">
<div>
<p><strong>Interfaces pures</strong> <em>(jamais <code>extends</code>, dans aucun des 34 cas)</em><br />
<code>Step</code>, <code>Invariant</code>, <code>Classifier</code>, <code>Structure</code>, <code>DataType</code>,<br />
<code>BindingConnector</code>, <code>Function</code>, <code>Expression</code>, <code>Predicate</code>,<br />
<code>BooleanExpression</code>, <code>StateUsage</code>, <code>UseCaseUsage</code>, <code>Metaclass</code>,<br />
<code>AnnotatingElement</code>, <code>MembershipImport</code>, <code>NamespaceImport</code>,<br />
<code>Class</code>, <code>EventOccurrenceUsage</code>, <code>Succession</code></p>
</div>
<div>
<p><strong>Classes à double statut</strong> <em>(primaires dans leur cas, déléguées ailleurs)</em><br />
<code>Association</code> (extends au cas 1, implements au cas 5)<br />
<code>Connector</code> (extends au cas 3, implements au cas 17)<br />
<code>AssociationStructure</code>, <code>MetadataFeature</code>, <code>AssertConstraintUsage</code>,<br />
<code>SuccessionFlow</code>, <code>ConnectorAsUsage</code>, <code>Flow</code> — chacune backbone<br />
dans son propre cas, déléguée quand un autre cas la réutilise</p>
</div>
</div>
<div class="takeaway">Le statut « interface » ou « classe » n'est pas une propriété absolue de chaque concept KerML — c'est une décision par paire, qui dépend de quel axe est le plus structurel dans <strong>ce</strong> contexte précis.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="62" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="ce-nest-pas-une-approche-ad-hoc--la-litt%C3%A9rature-mde-la-couvre">Ce n'est pas une approche ad hoc — la littérature MDE la couvre</h1>
<table>
<thead>
<tr>
<th>Technique</th>
<th>Source</th>
<th>Rapport avec notre approche</th>
</tr>
</thead>
<tbody>
<tr>
<td><em>Replace Inheritance with Delegation</em></td>
<td>Fowler, <em>Refactoring</em></td>
<td>Le refactoring nommé exact de « axe primaire + délégation » — un parent devient un champ délégué plutôt qu'un ancêtre</td>
</tr>
<tr>
<td><em>Role Object</em></td>
<td>Riehle &amp; Züllighoven</td>
<td>Traiter un axe secondaire comme un rôle que l'objet joue, pas comme une seconde identité de classe</td>
</tr>
<tr>
<td><strong>Flattening EMF/Ecore</strong></td>
<td>Eclipse Modeling Framework</td>
<td><strong>Précédent MDE direct</strong> : Ecore interdit aussi l'héritage multiple de classes Java généré — un seul parent choisi pour la classe d'implémentation, les features des autres super-types sont copiées (&quot;aplaties&quot;) directement dedans</td>
</tr>
</tbody>
</table>
<div class="takeaway">EMF/Ecore résout <strong>exactement</strong> ce problème pour <strong>exactement</strong> la même raison (génération Java depuis un métamodèle) — notre approche n'invente rien, elle suit un précédent MDE établi.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="63" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="le-flattening-emfecore-concr%C3%A8tement">Le flattening EMF/Ecore, concrètement</h1>
<div class="box m">
Vérifié dans la documentation officielle Eclipse (Javadoc <code>GenClass</code>) : « <em>This walks up the chain of GenClasses defined by getBaseGenClass() and returns the first that does not represent an abstract class or an interface; that is, the instantiable class that the implementation class should extend[...]</em> » — méthode <code>getClassExtendsGenClass()</code>.
</div>
<div class="two-col">
<div>
<p><strong>Point de départ : métamodèle Ecore</strong> <em>(pédagogique)</em></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>EClass NamedElement { name : String }
EClass TypedElement { type : EClassifier }

EClass Parameter
    eSuperTypes: NamedElement, TypedElement
    // héritage multiple, autorisé ici
</code></pre>
<ul>
<li>La classe Java générée (<code>*Impl</code>) n'a <strong>toujours qu'un seul<br />
parent</strong> : le premier ancêtre concret trouvé en remontant la<br />
chaîne — résolu par le générateur, pas dans le métamodèle</li>
</ul>
</div>
<div>
<p><strong>Résultat généré</strong> <em>(illustratif — pas un extrait du métamodèle Ecore réel)</em></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Impl généré : un seul extends, mais</span>
<span class="hljs-comment">// implémente aussi les autres interfaces</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">ParameterImpl</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">NamedElementImpl</span>  <span class="hljs-comment">// parent choisi</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">TypedElement</span> { <span class="hljs-comment">// 2e interface</span>
    <span class="hljs-comment">// le corps de TypedElement est fourni</span>
    <span class="hljs-comment">// ici, sur cette classe</span>
}
</code></pre>
</div>
</div>
<div class="takeaway">Exactement notre patron : interface multi-héritée (<code>mm.api</code>), classe d'implémentation à parent unique choisi automatiquement (<code>mm.impl</code>) — confirmé par la doc EMF elle-même, pas seulement par déduction.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-class="dense" lang="en-US" class="dense" data-marpit-pagination="64" style="--paginate:true;--class:dense;" data-marpit-pagination-total="65">
<h1 id="sources--emfecore">Sources — EMF/Ecore</h1>
<ul>
<li>Eclipse Foundation, Javadoc EMF 2.5.0, classe <code>GenClass</code>, méthodes <code>getClassExtendsGenClass()</code> / <code>getBaseGenClass()</code> — <a href="https://download.eclipse.org/modeling/emf/emf/javadoc/2.5.0/org/eclipse/emf/codegen/ecore/genmodel/GenClass.html">https://download.eclipse.org/modeling/emf/emf/javadoc/2.5.0/org/eclipse/emf/codegen/ecore/genmodel/GenClass.html</a></li>
<li>Eclipse Foundation, Javadoc EMF, classe <code>EClass</code> (héritage multiple autorisé via <code>eSuperTypes</code>, cycles interdits) — <a href="https://download.eclipse.org/modeling/emf/emf/javadoc/2.11/org/eclipse/emf/ecore/EClass.html">https://download.eclipse.org/modeling/emf/emf/javadoc/2.11/org/eclipse/emf/ecore/EClass.html</a></li>
</ul>
<div class="box y">
L'exemple <code>ParameterImpl</code>/<code>NamedElement</code>/<code>TypedElement</code> de la slide précédente est <strong>pédagogique</strong>, construit pour illustrer le mécanisme cité ci-dessus — ce n'est pas un extrait vérifié du métamodèle Ecore réel. Une recherche pour trouver un exemple authentique d'héritage multiple dans <code>Ecore.ecore</code> lui-même n'a pas abouti dans le temps alloué à cette session.
</div>
</section>
